<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJ & SONS JEWELLERS</title>

  <!-- WhatsApp & Social Card Preview -->
  <meta property="og:title" content="SJ & SONS JEWELLERS">
  <meta property="og:description" content="Follow us on Instagram & Join our VIP WhatsApp Group for latest designs!">
  <meta property="og:image" content="./file_00000000b748211cc2c45bf705462c5.png">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons for Instagram & WhatsApp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #12131a;
      background-image: radial-gradient(circle at 50% 20%, #202230 0%, #0e0f15 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    /* Carrd Container */
    .carrd-wrapper {
      width: 100%;
      max-width: 380px;
      background: #1b1c24;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    /* Top Banner */
    .banner-header {
      width: 100%;
      height: 150px;
      position: relative;
      background: #2a2b38;
    }

    .banner-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), #1b1c24);
    }

    /* Avatar / Logo */
    .avatar-box {
      width: 104px;
      height: 104px;
      margin: -52px auto 14px;
      position: relative;
      z-index: 2;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa7c11);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #000;
      display: block;
    }

    /* Content Area */
    .content-box {
      padding: 0 24px 30px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 13px;
      color: #9ea3b5;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    /* Links / Action Cards */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      background: #242632;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 14px 18px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .link-card:active {
      transform: scale(0.98);
      background: #2b2e3c;
    }

    /* Circular Social Icons */
    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .icon-instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      box-shadow: 0 4px 15px rgba(214, 36, 159, 0.35);
    }

    .icon-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
    }

    .link-info {
      margin-left: 16px;
      text-align: left;
    }

    .link-info h2 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .link-info p {
      font-size: 12px;
      color: #8c91a4;
    }

    /* Bottom Trust Tag */
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #d4af37;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="carrd-wrapper">
    <!-- Top Banner Image -->
    <div class="banner-header">
      <img src="./file_00000000b748211cc2c45bf705462c5.png" alt="SJ Jewellers Banner">
      <div class="banner-overlay"></div>
    </div>

    <!-- Center Avatar Logo -->
    <div class="avatar-box">
      <img src="./file_0000000015cb11f60ab4cfe571fb75f0.png" alt="SJ Jewellers Logo">
    </div>

    <!-- Bio & Links -->
    <div class="content-box">
      <h1>SJ & SONS JEWELLERS</h1>
      <p class="bio">100% BIS Hallmarked Gold & Silver Jewellery.<br>Stay connected with us for daily new designs!</p>

      <div class="links-list">
        <!-- Instagram Link -->
        <a href="https://instagram.com" target="_blank" class="link-card">
          <div class="icon-badge icon-instagram">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <div class="link-info">
            <h2>Instagram</h2>
            <p>Follow us for latest collections</p>
          </div>
        </a>

        <!-- WhatsApp Community/Group Link -->
        <a href="https://chat.whatsapp.com/" target="_blank" class="link-card">
          <div class="icon-badge icon-whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
          </div>
          <div class="link-info">
            <h2>WhatsApp Group</h2>
            <p>Join our VIP community updates</p>
          </div>
        </a>
      </div>

      <p class="footer-note">✦ 100% Hallmarked & Trusted ✦</p>
    </div>
  </div>

</body>
</html>
